name = "socialmanager"
main = "src/index.js"
compatibility_date = "2026-10-01"
# Node.js APIs for the WhatsApp gateway library (Baileys).
compatibility_flags = ["nodejs_compat"]
# Keep variables/secrets that were added from the Cloudflare dashboard.
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*", "/media/*", "/invite/*"]

# The database is created automatically on the first deploy.
[[d1_databases]]
binding = "DB"
database_name = "social-manager-db"

# Public Meta app identifiers (not secret). META_APP_SECRET stays a Cloudflare secret.
[vars]
META_APP_ID = "1074514768884948"
META_CONFIG_ID = "1118848971124486"

# Uploaded images (free KV storage). Created automatically on deploy.
[[kv_namespaces]]
binding = "MEDIA"

# Publishes scheduled posts every 5 minutes.
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

# Our own WhatsApp gateway (src/wa/gateway.js): one Durable Object per WhatsApp number.
[[durable_objects.bindings]]
name = "WA_GATEWAY"
class_name = "WhatsAppGateway"

[[migrations]]
tag = "wa-gateway-v1"
new_sqlite_classes = ["WhatsAppGateway"]

# "Publish now" runs in the background: one Durable Object job per post.
[[durable_objects.bindings]]
name = "PUBLISH_JOB"
class_name = "PublishJob"

[[migrations]]
tag = "publish-job-v1"
new_sqlite_classes = ["PublishJob"]

# Baileys runs in Workers with these stand-ins (see src/wa/).
[alias]
"ws" = "./src/wa/ws.js"
"pino" = "./src/wa/pino.js"
"whatsapp-rust-bridge" = "./src/wa/bridge.js"
